<!DOCTYPE html>
<!-- Error page. I used ChatGPT to help show a clear message. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Message</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
    <h1>Please check this</h1>
    <p role="alert">{{ message }}</p>
    <p><a href="/">Back to Home</a></p>
    {% if session.get('finished') %}
        <p>If saving failed, fix the file problem and <a href="/result">retry saving your result</a>.</p>
    {% endif %}
</main>
</body>
</html>
